<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>投資操作 | Editorial Grid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
        
        :root {
            --bg: #F5F5F0;
            --surface: #FFFFFF;
            --surface-2: #FAFAFA;
            --border: #111111;
            --border-light: #E6E3DF;
            --text: #111111;
            --text-dim: #686868;
            --green: #1B5E20;
            --red: #B71C1C;
            --amber: #B9770E;
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-serif: 'Playfair Display', serif;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-sans);
            margin: 0; padding: 24px 32px; 
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(80px, env(safe-area-inset-bottom));
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 0; }

        h1, h2, h3, .info-val, #final-assets {
            font-family: var(--font-serif);
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        /* 核心佈局升級：CSS Grid */
        .app-container {
            max-width: 1400px; /* 放寬最大寬度以容納多欄 */
            margin: 0 auto;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
            align-items: start;
        }
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--surface); 
            padding: 24px; 
            border: 1px solid var(--border);
            border-radius: 0;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.05);
            height: 100%; /* 在 Grid 中對齊高度 */
            display: flex;
            flex-direction: column;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 0;
            background: var(--surface); font-size: 15px; margin-bottom: 12px; box-sizing: border-box;
            outline: none; -webkit-appearance: none; color: var(--text); font-family: var(--font-sans);
            transition: box-shadow 0.2s;
        }
        select:focus, input:focus { box-shadow: 2px 2px 0px rgba(0,0,0,1); }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 100%; }
        .info-box {
            background: var(--surface); padding: 16px; text-align: left;
            border: 1px solid var(--border); border-radius: 0;
            display: flex; flex-direction: column; justify-content: center;
        }
        .info-label { font-size: 10px; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }
        .info-val { font-size: 32px; color: var(--text); }
        .info-val-accent { color: var(--text); }

        button {
            flex: 1; padding: 14px; border: 1px solid var(--border); font-weight: 600; 
            border-radius: 0; font-size: 11px; cursor: pointer; transition: all 0.2s; 
            font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 1.5px;
        }
        button:active { transform: translate(2px, 2px); }
        .btn-buy { background: var(--text); color: var(--surface); }
        .btn-sell { background: transparent; color: var(--text); }
        .btn-action { background: var(--text); color: var(--surface); width: 100%; }
        .btn-disabled { background: var(--border-light); color: var(--text-dim); border-color: var(--border-light); pointer-events: none; }

        .tag {
            font-size: 9px; padding: 4px 8px; border-radius: 0; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; display: inline-block; 
            vertical-align: middle; margin-left: 8px; border: 1px solid var(--border);
            background: transparent; color: var(--text);
        }

        .text-up { color: var(--green); } .text-down { color: var(--red); }
        .price-change { font-size: 12px; font-weight: 500; font-family: var(--font-sans); margin-top: 4px; display: block;}

        .deposit-item {
            border-bottom: 1px solid var(--border-light); padding: 16px 0; font-size: 14px;
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .deposit-item:last-child { border-bottom: none; }

        .section-title {
            font-family: var(--font-serif);
            font-size: 26px; font-weight: 400; letter-spacing: -0.5px;
            color: var(--text); margin: 0 0 24px 0;
            border-bottom: 2px solid var(--border); padding-bottom: 12px;
        }

        .holding-bar {
            background: var(--surface-2); padding: 12px 16px; font-size: 11px;
            margin: 16px 0; color: var(--text-dim); border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            text-transform: uppercase; letter-spacing: 1px;
            margin-top: auto; /* 將持倉與交易區塊推到底部 */
        }
        .holding-bar strong { color: var(--text); font-family: var(--font-serif); font-size: 16px; letter-spacing: 0; text-transform: none;}

        .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
        .trade-col select { margin: 0; font-size: 13px; padding: 12px; }

        .bond-info {
            font-size: 10px; color: var(--text-dim); border: 1px solid var(--border-light);
            padding: 2px 6px; display: inline-block; margin-top: 6px; font-weight: 500;
        }

        #news-modal, #end-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(245, 245, 240, 0.95); backdrop-filter: blur(4px); z-index: 200;
            display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-card {
            background: var(--surface); width: 100%; max-width: 440px; padding: 40px;
            border-radius: 0; text-align: left; border: 1px solid var(--border);
            box-shadow: 12px 12px 0px rgba(0,0,0,0.1);
        }
        .modal-card h1 { font-size: 40px; margin-bottom: 12px; }
        .modal-card h2 { font-size: 28px; margin-bottom: 12px; }
        .modal-card p { font-size: 14px; color: var(--text-dim); line-height: 1.6; font-family: var(--font-sans); }
        .modal-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 16px; text-transform: uppercase;}

        #toast {
            position: fixed; bottom: max(40px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--surface); padding: 16px 32px; border-radius: 0;
            display: none; z-index: 100; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;
            border: 1px solid var(--border); box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        }

        #login-screen .card { padding: 60px 40px; box-shadow: 8px 8px 0px rgba(0,0,0,0.05); text-align: left; height: auto;}
        #login-screen h2 { font-size: 46px; font-weight: 500; letter-spacing: -1px; margin-bottom: 8px; }
        #login-screen .login-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px;}
        #login-screen input { text-align: left; font-size: 16px; border-bottom: 2px solid var(--border); border-top: none; border-left: none; border-right: none; padding-left: 0; background: transparent;}

        .header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; border-bottom: 2px solid var(--border); padding-bottom: 20px;}
        .header-row h1 { font-size: 42px; font-weight: 500; letter-spacing: -1px; }
        .player-meta { font-size: 10px; color: var(--text-dim); margin-top: 8px; text-transform: uppercase; letter-spacing: 1px;}
        .player-meta a { color: var(--text); cursor: pointer; text-decoration: underline; font-weight: 600;}
        
        .round-pill {
            background: transparent; color: var(--text); font-size: 10px; font-weight: 600;
            padding: 6px 12px; border: 1px solid var(--border);
            white-space: nowrap; text-transform: uppercase; letter-spacing: 1px;
        }

        .deposit-form { background: transparent; padding: 0; margin-bottom: 12px; border: none; }
        .deposit-form .row { display: flex; gap: 12px; }
        
        .market-price-disp { font-size: 26px; font-weight: 500; font-family: var(--font-serif); letter-spacing: -0.5px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { animation: fadeIn 0.4s ease-out; }
    </style>
</head>
<body>
    <div id="news-modal">
        <div class="modal-card">
            <div class="modal-label">BREAKING NEWS</div>
            <h2 id="modal-title">快訊</h2>
            <p id="modal-desc" style="margin-bottom: 32px;">...</p>
            <button class="btn-action" onclick="document.getElementById('news-modal').style.display='none'">我知道了</button>
        </div>
    </div>
    <div id="end-screen">
        <div class="modal-card">
            <div class="modal-label">SESSION ENDED</div>
            <h1>遊戲結束</h1>
            <p style="margin-bottom: 24px;">最終資產結算</p>
            <div id="final-assets" style="font-size: 48px; color: var(--text); margin-bottom: 32px; border-bottom: 2px solid var(--border); padding-bottom: 16px;">$0</div>
            <div id="final-breakdown" style="text-align: left; background: var(--surface-2); padding: 20px; font-size: 14px; border: 1px solid var(--border);"></div>
        </div>
    </div>

    <div id="login-screen" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 16px;">
        <div class="card" style="max-width: 400px; margin: 0 auto; width: 100%;">
            <div class="modal-label">01 / SIMULATOR</div>
            <h2>股市大亨</h2>
            <div class="login-sub">Market Simulator &middot; Editorial Ed.</div>
            <input type="text" id="username" placeholder="輸入姓名 / 組別">
            <button class="btn-action" style="margin-top: 16px;" onclick="attemptJoin()">進入市場</button>
        </div>
    </div>

    <div id="game-screen" class="app-container" style="display:none;">
        <div class="header-row">
            <div>
                <h1>我的資產</h1>
                <div class="player-meta">
                    CLIENT: <span id="player-name-display" style="font-weight: 600; color: var(--text);"></span> &nbsp;&nbsp;&middot;&nbsp;&nbsp; <a onclick="logout()">登出 (LOGOUT)</a>
                </div>
            </div>
            <span id="round-display" class="round-pill">載入中...</span>
        </div>

        <div class="dashboard-grid">
            <!-- 資產卡片 -->
            <div class="card">
                <div class="info-grid">
                    <div class="info-box">
                        <div class="info-label">現金 (CASH)</div>
                        <div class="info-val" id="p-cash">$0</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">總資產 (TOTAL)</div>
                        <div class="info-val info-val-accent" id="p-total">$0</div>
                    </div>
                </div>
            </div>

            <!-- 存款卡片 -->
            <div class="card">
                <div style="display:flex; align-items:baseline; justify-content:space-between; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px;">
                    <h3 style="font-size: 22px;">定期存款</h3>
                    <span style="font-size: 10px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; color: var(--text-dim);">Fixed Deposit</span>
                </div>
                <div class="deposit-form">
                    <div class="row">
                        <input type="number" id="deposit-amount" placeholder="金額 (Amount)" style="flex:1;">
                        <select id="deposit-duration" style="flex:1.2;">
                            <option value="3">3個月 (0.125%)</option>
                            <option value="6">6個月 (0.125%)</option>
                            <option value="9">9個月 (0.150%)</option>
                            <option value="12">12個月 (0.150%)</option>
                        </select>
                    </div>
                    <button class="btn-buy" style="width:100%; margin-top: 8px;" onclick="createDeposit()">立即存入</button>
                </div>
                <div id="deposit-list" style="margin-top: 16px;"></div>
            </div>
        </div>

        <div class="section-title">市場報價 <span style="font-size: 12px; font-family: var(--font-sans); color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-left: 12px;">Market Overview</span></div>
        <div id="market-list" class="market-grid"></div>
    </div>
    <div id="toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myData = null, currentMarket = null, currentRound = 0;

        function getUserId() {
            let uid = localStorage.getItem('stockGameUID');
            if (!uid) {
                uid = 'user_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
                localStorage.setItem('stockGameUID', uid);
            }
            return uid;
        }

        window.onload = function() {
            const savedName = localStorage.getItem('stockGameUser');
            if (savedName) {
                document.getElementById('username').value = savedName;
                attemptJoin(true);
            }
        };

        function attemptJoin(isAuto = false) {
            const nameInput = document.getElementById('username');
            const name = nameInput.value.trim();
            const uid = getUserId();
            if(name) {
                if(!isAuto) localStorage.setItem('stockGameUser', name);
                socket.emit('join_game', 'player', { name: name, userId: uid });
            }
        }

        function logout() {
            if(confirm("確定要登出並清除紀錄嗎？")) {
                localStorage.removeItem('stockGameUser');
                window.location.reload();
            }
        }

        socket.on('login_failed', (msg) => {
            alert(msg);
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('game-screen').style.display = 'none';
            localStorage.removeItem('stockGameUser');
        });

        socket.on('init_player', data => {
            if(data.reload) window.location.reload();
            currentRound = data.round;
            document.getElementById('player-name-display').innerText = data.player.name;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateAll(data);
            if(data.lastEvent) showNews(data.lastEvent);
        });

        socket.on('update_player', data => { updateAll({ player: data.player, market: currentMarket }); if(data.msg) showToast(data.msg); });
        socket.on('error_msg', msg => showToast(msg));

        socket.on('new_round', data => {
            currentMarket = data.market;
            currentRound = data.round;
            document.getElementById('round-display').innerText = `Round ${data.round} (${data.round*3}m)`;
            renderMarket();
            if(myData) renderDeposits(myData.deposits);
            if(data.event) showNews(data.event);
        });

        socket.on('game_over', data => {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('news-modal').style.display = 'none';
            let me = data.players[socket.id] || myData;
            let stockVal = 0;
            for(let code in me.portfolio) if(data.market[code]) stockVal += me.portfolio[code] * data.market[code].price;
            let depositTotal = 0;
            if(me.deposits) me.deposits.forEach(d => depositTotal += d.amount);
            let total = me.cash + depositTotal + stockVal;
            document.getElementById('final-assets').innerText = '$' + Math.floor(total).toLocaleString();
            document.getElementById('final-breakdown').innerHTML =
                `<div style="display:flex; justify-content:space-between; margin-bottom:12px; color:var(--text); border-bottom: 1px solid var(--border-light); padding-bottom: 8px;"><span style="color:var(--text-dim); text-transform: uppercase; font-size: 11px; letter-spacing: 1px;">現金 (Cash)</span> <span style="font-weight:600; font-family: var(--font-serif); font-size: 16px;">$${Math.floor(me.cash).toLocaleString()}</span></div>` +
                `<div style="display:flex; justify-content:space-between; margin-bottom:12px; color:var(--text); border-bottom: 1px solid var(--border-light); padding-bottom: 8px;"><span style="color:var(--text-dim); text-transform: uppercase; font-size: 11px; letter-spacing: 1px;">定存 (Deposit)</span> <span style="font-weight:600; font-family: var(--font-serif); font-size: 16px;">$${Math.floor(depositTotal).toLocaleString()}</span></div>` +
                `<div style="display:flex; justify-content:space-between; color:var(--text);"><span style="color:var(--text-dim); text-transform: uppercase; font-size: 11px; letter-spacing: 1px;">證券 (Securities)</span> <span style="font-weight:600; font-family: var(--font-serif); font-size: 16px;">$${Math.floor(stockVal).toLocaleString()}</span></div>`;
            document.getElementById('end-screen').style.display = 'flex';
        });

        function showNews(event) {
            document.getElementById('modal-title').innerText = event.title;
            document.getElementById('modal-desc').innerText = event.desc;
            document.getElementById('news-modal').style.display = 'flex';
        }

        function updateAll(data) {
            myData = data.player;
            if(data.market) currentMarket = data.market;
            if(data.round !== undefined) currentRound = data.round;
            document.getElementById('round-display').innerText = `Round ${currentRound} (${currentRound*3}m)`;
            let stockVal = 0;
            if(currentMarket) { for(let code in myData.portfolio) stockVal += myData.portfolio[code] * currentMarket[code].price; }
            let depositTotal = 0;
            if(myData.deposits) myData.deposits.forEach(d => depositTotal += d.amount);
            let total = myData.cash + depositTotal + stockVal;
            document.getElementById('p-cash').innerText = '$' + Math.floor(myData.cash).toLocaleString();
            document.getElementById('p-total').innerText = '$' + Math.floor(total).toLocaleString();
            renderDeposits(myData.deposits);
            renderMarket();
        }

        function renderDeposits(deposits) {
            const list = document.getElementById('deposit-list');
            if(!deposits || deposits.length === 0) {
                list.innerHTML = '<div style="text-align:left; color:var(--text-dim); font-size:12px; padding:16px; border: 1px solid var(--border-light); text-transform: uppercase; letter-spacing: 1px;">目前沒有定存 (No Active Deposits)</div>';
                return;
            }
            list.innerHTML = deposits.map(d => {
                let roundsLeft = d.maturityRound - currentRound;
                let statusColor = roundsLeft <= 0 ? 'var(--text)' : 'var(--text-dim)';
                let statusBg = roundsLeft <= 0 ? 'var(--border-light)' : 'transparent';
                let statusBorder = roundsLeft <= 0 ? 'var(--border)' : 'var(--border-light)';
                return `<div class="deposit-item">
                    <div>
                        <div style="font-weight:500; font-family: var(--font-serif); font-size: 20px; color:var(--text);">$${d.amount.toLocaleString()}</div>
                        <div style="font-size:11px; color:var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;">${d.duration}個月期 (Months)</div>
                    </div>
                    <div style="font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:${statusColor}; background:${statusBg}; padding:6px 12px; border:1px solid ${statusBorder};">
                        ${roundsLeft <= 0 ? "結算中 (Processing)" : `剩 ${roundsLeft} 回合 (Rounds Left)`}
                    </div>
                </div>`;
            }).join('');
        }

        function renderMarket() {
            if (!currentMarket) return;
            const list = document.getElementById('market-list');
            list.innerHTML = Object.keys(currentMarket).map(code => {
                const item = currentMarket[code];
                const holdingQty = myData.portfolio[code] || 0;
                const lotsHeld = Math.floor(holdingQty / item.lotSize);
                let costPerLot = item.price * item.lotSize;
                let feeMultiplier = item.type === 'stock' ? 1.004 : 1;
                let maxBuy = Math.floor(myData.cash / (costPerLot * feeMultiplier));
                if(item.type === 'bond' && (costPerLot < item.minEntry)) { let minLots = Math.ceil(item.minEntry / costPerLot); if (maxBuy < minLots) maxBuy = 0; }
                let unitName = item.type === 'gold' ? '兩' : '手';
                let shareUnit = item.type === 'gold' ? '兩' : (item.type === 'bond' ? '單位' : '股');
                let buyOptions = maxBuy === 0 ? `<option value="0">餘額不足</option>` : "";
                if (maxBuy > 0) { let limit = Math.min(maxBuy, 100); for(let i=1; i<=limit; i++) buyOptions += `<option value="${i}">${i} ${unitName} ($${Math.floor(i*costPerLot).toLocaleString()})</option>`; }
                let sellOptions = lotsHeld === 0 ? `<option value="0">無持倉</option>` : "";
                if (lotsHeld > 0) { let limit = Math.min(lotsHeld, 100); for(let i=1; i<=limit; i++) sellOptions += `<option value="${i}">${i} ${unitName}</option>`; }
                let change = item.change || 0; let pct = item.changePercent || 0;
                let colorClass = change >= 0 ? "text-up" : "text-down";
                let arrow = change > 0 ? "↗" : (change < 0 ? "↘" : "");
                let changeDisplay = change !== 0 ? `<span class="price-change ${colorClass}">${arrow} ${Math.abs(change).toFixed(2)} (${change>=0?"+":""}${pct.toFixed(1)}%)</span>` : `<span class="price-change" style="color:var(--text-dim);">—</span>`;
                let tagName = item.type === 'gold' ? 'GOLD' : (item.type === 'bond' ? 'BOND' : 'STOCK');
                let extraInfo = item.type === 'bond' ? `<br><span class="bond-info">年息 ${item.coupon}%</span>` : '';
                
                return `<div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <div style="font-weight:500; font-family: var(--font-serif); font-size:22px; letter-spacing: -0.5px;">${item.name}<span class="tag">${tagName}</span></div>
                            <div style="color:var(--text-dim); font-size:11px; margin-top:6px; font-weight: 500; letter-spacing: 0.5px;">${code}${extraInfo}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="market-price-disp">$${item.price.toFixed(2)}</div>
                            ${changeDisplay}
                        </div>
                    </div>
                    
                    <div class="holding-bar">
                        <span>持有 (Holding)</span>
                        <span><strong>${holdingQty}</strong> ${shareUnit} / ${lotsHeld} ${unitName}</span>
                    </div>
                    
                    <div class="trade-grid">
                        <div class="trade-col">
                            <select id="buy-select-${code}">${buyOptions}</select>
                            <button class="${maxBuy > 0 ? 'btn-buy' : 'btn-disabled'}" style="width:100%; margin-top:4px;" onclick="trade('buy', '${code}')">買入 (BUY)</button>
                        </div>
                        <div class="trade-col">
                            <select id="sell-select-${code}">${sellOptions}</select>
                            <button class="${lotsHeld > 0 ? 'btn-sell' : 'btn-disabled'}" style="width:100%; margin-top:4px;" onclick="trade('sell', '${code}')">賣出 (SELL)</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function trade(action, code) {
            const selectId = action === 'buy' ? `buy-select-${code}` : `sell-select-${code}`;
            const val = document.getElementById(selectId).value;
            if(val === "0" || !val) return;
            socket.emit('trade', action, code, parseInt(val));
        }
        function createDeposit() {
            const amt = document.getElementById('deposit-amount').value;
            const dur = document.getElementById('deposit-duration').value;
            if(!amt || amt <= 0) return showToast("請輸入有效金額");
            socket.emit('create_deposit', amt, dur);
            document.getElementById('deposit-amount').value = '';
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
