<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Market Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
        
        :root {
            --bg: #F5F5F0;
            --surface: #FFFFFF;
            --surface-2: #FAFAFA;
            --border: #111111;
            --border-light: #E6E3DF;
            --text: #111111;
            --text-dim: #686868;
            --green: #1B5E20;
            --red: #B71C1C;
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-serif: 'Playfair Display', serif;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-sans);
            margin: 0; 
            padding: 16px 12px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(80px, env(safe-area-inset-bottom));
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .info-val, #final-assets { font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.5px; }

        .app-container { max-width: 1400px; margin: 0 auto; }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 32px; align-items: start; }
        .market-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

        .card {
            background: var(--surface); padding: 16px; border: 1px solid var(--border);
            border-radius: 0; box-shadow: 4px 4px 0px rgba(0,0,0,0.05); height: 100%; display: flex; flex-direction: column;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 0;
            background: var(--surface); font-size: 14px; margin-bottom: 12px; box-sizing: border-box;
            outline: none; -webkit-appearance: none; color: var(--text); font-family: var(--font-sans); transition: box-shadow 0.2s;
        }
        select:focus, input:focus { box-shadow: 2px 2px 0px rgba(0,0,0,1); }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 100%; }
        .info-box { background: var(--surface); padding: 12px; text-align: left; border: 1px solid var(--border); border-radius: 0; display: flex; flex-direction: column; justify-content: center; }
        .info-label { font-size: 9px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .info-val { font-size: 24px; color: var(--text); } 
        .info-val-accent { color: var(--text); }

        button {
            flex: 1; padding: 12px; border: 1px solid var(--border); font-weight: 600; 
            border-radius: 0; font-size: 11px; cursor: pointer; transition: all 0.2s; 
            font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 1px;
        }
        button:active { transform: translate(2px, 2px); }
        .btn-buy { background: var(--text); color: var(--surface); }
        .btn-sell { background: transparent; color: var(--text); }
        .btn-action { background: var(--text); color: var(--surface); width: 100%; }
        .btn-disabled { background: var(--border-light); color: var(--text-dim); border-color: var(--border-light); pointer-events: none; }

        /* 讓標籤具備按鈕的互動感 */
        .tag { font-size: 9px; padding: 4px 8px; border-radius: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; display: inline-block; vertical-align: middle; margin-left: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); transition: all 0.2s;}
        .tag:hover { background: var(--text); color: var(--surface); cursor: pointer; }
        
        .text-up { color: var(--green); } .text-down { color: var(--red); }
        .price-change { font-size: 12px; font-weight: 500; font-family: var(--font-sans); margin-top: 4px; display: block;}
        
        .deposit-item { border-bottom: 1px solid var(--border-light); padding: 16px 0; font-size: 14px; display: flex; justify-content: space-between; align-items: flex-start; }
        .deposit-item:last-child { border-bottom: none; }

        .section-title { font-family: var(--font-serif); font-size: 22px; font-weight: 400; letter-spacing: -0.5px; color: var(--text); margin: 0 0 16px 0; border-bottom: 2px solid var(--border); padding-bottom: 12px; }

        .holding-bar {
            background: var(--surface-2); padding: 12px; font-size: 10px; margin: 16px 0; color: var(--text-dim); border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 1px; margin-top: auto; 
        }
        .holding-bar strong { color: var(--text); font-family: var(--font-serif); font-size: 14px; letter-spacing: 0; text-transform: none;}

        .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
        .trade-col select { margin: 0; font-size: 12px; padding: 10px; }
        .bond-info { font-size: 10px; color: var(--text-dim); border: 1px solid var(--border-light); padding: 2px 6px; display: inline-block; margin-top: 6px; font-weight: 500; }

        #news-modal, #end-screen, #info-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245, 245, 240, 0.95); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 12px; }
        .modal-card { background: var(--surface); width: 100%; max-width: 440px; padding: 24px; border-radius: 0; text-align: left; border: 1px solid var(--border); box-shadow: 8px 8px 0px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; }
        .modal-card h1 { font-size: 32px; margin-bottom: 12px; }
        .modal-card h2 { font-size: 24px; margin-bottom: 12px; }
        .modal-card p { font-size: 13px; color: var(--text-dim); line-height: 1.6; font-family: var(--font-sans); }
        .modal-label { font-size: 9px; font-weight: 600; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase;}

        #toast { position: fixed; bottom: max(40px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 12px 24px; border-radius: 0; display: none; z-index: 100; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; border: 1px solid var(--border); box-shadow: 4px 4px 0px rgba(0,0,0,0.2); white-space: nowrap; }

        #login-screen .card { padding: 40px 24px; box-shadow: 8px 8px 0px rgba(0,0,0,0.05); text-align: left; height: auto;}
        #login-screen h2 { font-size: 36px; font-weight: 500; letter-spacing: -1px; margin-bottom: 8px; }
        #login-screen .login-sub { font-size: 10px; color: var(--text-dim); margin-bottom: 32px; text-transform: uppercase; letter-spacing: 1px;}
        #login-screen input { text-align: left; font-size: 16px; border-bottom: 2px solid var(--border); border-top: none; border-left: none; border-right: none; padding-left: 0; background: transparent;}

        .header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; border-bottom: 2px solid var(--border); padding-bottom: 16px;}
        .header-row h1 { font-size: 32px; font-weight: 500; letter-spacing: -1px; margin-bottom: 0;}
        .player-meta { font-size: 9px; color: var(--text-dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px;}
        .player-meta a { color: var(--text); cursor: pointer; text-decoration: underline; font-weight: 600;}
        
        .round-pill { background: transparent; color: var(--text); font-size: 9px; font-weight: 600; padding: 4px 8px; border: 1px solid var(--border); margin-bottom: 4px; white-space: nowrap; text-transform: uppercase; letter-spacing: 1px; }

        .deposit-form { background: transparent; padding: 0; margin-bottom: 8px; border: none; }
        .deposit-form .row { display: flex; gap: 8px; flex-direction: column; }
        
        .market-price-disp { font-size: 22px; font-weight: 500; font-family: var(--font-serif); letter-spacing: -0.5px; }
        
        #final-rank-badge { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--surface); background: var(--text); border: 1px solid var(--border); padding: 6px 12px; display: inline-block; margin-bottom: 16px; font-family: var(--font-sans); }

        .lang-btn { position: fixed; top: 16px; right: 16px; background: transparent; color: var(--text); border: 1px solid var(--border); padding: 6px 10px; font-size: 10px; font-weight: 600; cursor: pointer; z-index: 1000; font-family: var(--font-sans); text-transform: uppercase;}

        @media (min-width: 768px) {
            body { padding: 24px 32px; }
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 40px; }
            .market-grid { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
            .card { padding: 24px; }
            .info-grid { gap: 16px; }
            .info-box { padding: 16px; }
            .info-val { font-size: 32px; }
            .info-label { font-size: 10px; letter-spacing: 1.5px; }
            .modal-card { padding: 40px; }
            .modal-card h1 { font-size: 40px; }
            .header-row { margin-bottom: 32px; padding-bottom: 20px; }
            .header-row h1 { font-size: 42px; }
            .deposit-form .row { flex-direction: row; gap: 12px; }
            .section-title { font-size: 26px; margin: 0 0 24px 0; }
            .market-price-disp { font-size: 26px; }
            #final-rank-badge { font-size: 14px; padding: 8px 16px; letter-spacing: 2px; margin-bottom: 24px; }
            .lang-btn { top: 24px; right: 32px; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { animation: fadeIn 0.4s ease-out; }
    </style>
</head>
<body>
    <button id="lang-toggle" class="lang-btn" onclick="toggleLang()">中文</button>

    <div id="info-modal">
        <div class="modal-card">
            <div class="modal-label" id="lbl-info-tag">KNOWLEDGE BASE</div>
            <h2 id="info-title" style="margin-bottom: 24px;">Asset</h2>
            
            <div class="modal-label" id="lbl-info-dse" style="border-bottom: 1px solid var(--border-light); padding-bottom: 8px; margin-bottom: 8px; color: var(--text);">HKDSE CONCEPT</div>
            <p id="info-dse" style="margin-bottom: 24px;">...</p>

            <div class="modal-label" id="lbl-info-fact" style="border-bottom: 1px solid var(--border-light); padding-bottom: 8px; margin-bottom: 8px; color: var(--text);">DID YOU KNOW?</div>
            <p id="info-fact" style="margin-bottom: 32px;">...</p>

            <button class="btn-action" id="btn-info-close" onclick="document.getElementById('info-modal').style.display='none'">Close</button>
        </div>
    </div>

    <div id="news-modal">
        <div class="modal-card">
            <div class="modal-label" id="lbl-news-tag">BREAKING NEWS</div>
            <h2 id="modal-title">News</h2>
            <p id="modal-desc" style="margin-bottom: 32px;">...</p>
            <button class="btn-action" id="btn-news" onclick="document.getElementById('news-modal').style.display='none'">Got it</button>
        </div>
    </div>
    
    <div id="end-screen">
        <div class="modal-card">
            <div class="modal-label" id="lbl-end-tag">SESSION ENDED</div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <h1 id="end-title">Game Over</h1>
                <div id="final-rank-badge">RANK #--</div>
            </div>
            
            <div id="final-assets" style="font-size: 40px; color: var(--text); margin-bottom: 20px; padding-top: 16px; border-top: 1px solid var(--border-light); font-family: var(--font-serif);">$0</div>
            
            <div id="final-breakdown" style="text-align: left; background: var(--surface-2); padding: 16px; font-size: 12px; border: 1px solid var(--border); margin-bottom: 24px;"></div>
            
            <div class="modal-label" id="lbl-lb" style="margin-bottom: 12px; border-bottom: 2px solid var(--border); padding-bottom: 8px; color: var(--text);">LEADERBOARD</div>
            <div id="final-leaderboard"></div>
        </div>
    </div>

    <div id="login-screen" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 16px;">
        <div class="card" style="max-width: 400px; margin: 0 auto; width: 100%;">
            <div class="modal-label">01 / SIMULATOR</div>
            <h2 id="sim-title">Market Simulator</h2>
            <div class="login-sub" id="sim-sub">Enter to start trading</div>
            <input type="text" id="username" placeholder="Enter Name / Group">
            <button class="btn-action" id="btn-enter" style="margin-top: 16px;" onclick="attemptJoin()">Enter Market</button>
        </div>
    </div>

    <div id="game-screen" class="app-container" style="display:none;">
        <div class="header-row">
            <div>
                <h1 id="title-assets">My Assets</h1>
                <div class="player-meta">
                    <span id="lbl-client">CLIENT:</span> <span id="player-name-display" style="font-weight: 600; color: var(--text);"></span> &nbsp;&nbsp;&middot;&nbsp;&nbsp; <a id="btn-logout" onclick="logout()">LOGOUT</a>
                </div>
            </div>
            <span id="round-display" class="round-pill">Loading...</span>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="info-grid">
                    <div class="info-box">
                        <div class="info-label" id="lbl-cash">CASH</div>
                        <div class="info-val" id="p-cash">$0</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label" id="lbl-total">TOTAL ASSETS</div>
                        <div class="info-val info-val-accent" id="p-total">$0</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div style="display:flex; align-items:baseline; justify-content:space-between; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px;">
                    <h3 style="font-size: 20px;" id="title-dep">Time Deposit</h3>
                </div>
                <div class="deposit-form">
                    <div class="row">
                        <input type="number" id="deposit-amount" placeholder="Amount" style="flex:1;">
                        <select id="deposit-duration" style="flex:1.2;">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <button class="btn-buy" id="btn-dep" style="width:100%; margin-top: 8px;" onclick="createDeposit()">Deposit Now</button>
                </div>
                <div id="deposit-list" style="margin-top: 16px;"></div>
            </div>
        </div>

        <div class="section-title" id="title-market">Market Overview</div>
        <div id="market-list" class="market-grid"></div>
    </div>
    <div id="toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const i18n = {
            en: {
                langBtn: "中文", simTitle: "Market Simulator", simSub: "Enter to start trading", namePlace: "Enter Name / Group", enterMarket: "Enter Market",
                myAssets: "My Assets", client: "CLIENT:", logout: "LOGOUT", loading: "Loading...", cash: "CASH", total: "TOTAL ASSETS",
                timeDeposit: "Time Deposit", amountPlace: "Amount", depBtn: "Deposit Now", noDep: "No Active Deposits",
                marketTitle: "Market Overview", newsLabel: "BREAKING NEWS", newsBtn: "Got it", endLabel: "SESSION ENDED",
                endTitle: "Game Over", endSub: "Final Asset Calculation", lbLabel: "LEADERBOARD", months: "Months", roundsLeft: "Rounds Left",
                proc: "Processing", holding: "Holding", buy: "BUY", sell: "SELL", noCash: "No Cash", noHold: "No Holding", sec: "Securities",
                you: "YOU", rank: "RANK", coupon: "Coupon", 
                infoClose: "Close", infoTag: "KNOWLEDGE BASE", infoDSELabel: "HKDSE BAFS CONCEPT", infoFactLabel: "DID YOU KNOW?",
                infoStockTitle: "Stock (Equity)",
                infoStockDSE: "Represents ownership in a company (equity financing). Holders have voting rights and may receive dividends, but bear higher risks as returns are not guaranteed.",
                infoStockFact: "The first modern stock market was established in Amsterdam in 1611 by the Dutch East India Company.",
                infoBondTitle: "Bond (Debt)",
                infoBondDSE: "Represents a loan made by an investor to a borrower (debt financing). It usually pays fixed interest (coupon) and returns the principal at maturity. Generally lower risk than stocks.",
                infoBondFact: "During WWI, the US government issued 'Liberty Bonds' to finance the war effort, which popularized bonds among retail investors.",
                infoGoldTitle: "Gold (Commodity)",
                infoGoldDSE: "A physical asset often used as a hedge against inflation and economic instability. It pays no interest or dividends, meaning its return relies solely on price appreciation.",
                infoGoldFact: "All the gold ever mined in human history would fit into a cube measuring just about 22 meters on each side!"
            },
            tc: {
                langBtn: "EN", simTitle: "股市大亨", simSub: "投資模擬器", namePlace: "輸入姓名 / 組別", enterMarket: "進入市場",
                myAssets: "我的資產", client: "玩家:", logout: "登出", loading: "載入中...", cash: "現金", total: "總資產",
                timeDeposit: "定期存款", amountPlace: "輸入金額", depBtn: "立即存入", noDep: "目前沒有定存",
                marketTitle: "市場報價", newsLabel: "最新快訊", newsBtn: "我知道了", endLabel: "結算完成",
                endTitle: "遊戲結束", endSub: "最終資產結算", lbLabel: "排行榜", months: "個月", roundsLeft: "剩餘回合",
                proc: "結算中", holding: "持有", buy: "買入", sell: "賣出", noCash: "餘額不足", noHold: "無持倉", sec: "證券",
                you: "自己", rank: "排名", coupon: "年息",
                infoClose: "關閉", infoTag: "知識庫", infoDSELabel: "HKDSE 企會財重點", infoFactLabel: "冷知識",
                infoStockTitle: "股票 (股本融資)",
                infoStockDSE: "代表公司擁有權，屬於股本融資。股東有投票權及收取股息的權利，但由於回報非保證，風險較高。",
                infoStockFact: "世界上第一個現代股票市場於1611年在阿姆斯特丹成立，由荷蘭東印度公司發行股票籌集資金。",
                infoBondTitle: "債券 (債務融資)",
                infoBondDSE: "代表投資者向借款人提供的貸款，屬於債務融資。通常定期支付固定利息（票息）並在到期時償還本金。風險一般低於股票。",
                infoBondFact: "一戰期間，美國政府發行「自由債券」籌集軍費，這項愛國運動讓債券在散戶投資者中廣泛普及。",
                infoGoldTitle: "黃金 (實物資產)",
                infoGoldDSE: "一種實物資產，常被用作對沖通脹和經濟動盪的避險工具。黃金本身不產生任何利息或股息，回報僅依賴價格上漲。",
                infoGoldFact: "人類歷史上開採的所有黃金，如果全部熔合在一起，大約只能填滿一個邊長 22 米的正方體！"
            }
        };

        let currentLang = localStorage.getItem('appLang') || 'en';
        function t(key) { return i18n[currentLang][key] || key; }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'tc' : 'en';
            localStorage.setItem('appLang', currentLang);
            updateStaticUI();
            if (myData) { renderDeposits(myData.deposits); renderMarket(); }
            if (document.getElementById('end-screen').style.display === 'flex') {
                if (window.lastGameOverData) {
                    renderGameOverScreen(window.lastGameOverData);
                }
            }
        }

        function updateStaticUI() {
            document.documentElement.lang = currentLang;
            document.getElementById('lang-toggle').innerText = t('langBtn');
            document.getElementById('sim-title').innerText = t('simTitle');
            document.getElementById('sim-sub').innerText = t('simSub');
            document.getElementById('username').placeholder = t('namePlace');
            document.getElementById('btn-enter').innerText = t('enterMarket');
            document.getElementById('title-assets').innerText = t('myAssets');
            document.getElementById('lbl-client').innerText = t('client');
            document.getElementById('btn-logout').innerText = t('logout');
            document.getElementById('lbl-cash').innerText = t('cash');
            document.getElementById('lbl-total').innerText = t('total');
            document.getElementById('title-dep').innerText = t('timeDeposit');
            document.getElementById('deposit-amount').placeholder = t('amountPlace');
            document.getElementById('btn-dep').innerText = t('depBtn');
            document.getElementById('title-market').innerText = t('marketTitle');
            document.getElementById('lbl-news-tag').innerText = t('newsLabel');
            document.getElementById('btn-news').innerText = t('newsBtn');
            document.getElementById('lbl-end-tag').innerText = t('endLabel');
            document.getElementById('end-title').innerText = t('endTitle');
            document.getElementById('lbl-lb').innerText = t('lbLabel');
            
            document.getElementById('lbl-info-tag').innerText = t('infoTag');
            document.getElementById('lbl-info-dse').innerText = t('infoDSELabel');
            document.getElementById('lbl-info-fact').innerText = t('infoFactLabel');
            document.getElementById('btn-info-close').innerText = t('infoClose');

            const depSel = document.getElementById('deposit-duration');
            const oldVal = depSel.value || "3";
            depSel.innerHTML = `
                <option value="3">3 ${t('months')} (0.125%)</option>
                <option value="6">6 ${t('months')} (0.125%)</option>
                <option value="9">9 ${t('months')} (0.150%)</option>
                <option value="12">12 ${t('months')} (0.150%)</option>
            `;
            depSel.value = oldVal;
            
            if(document.getElementById('round-display').innerText === 'Loading...' || document.getElementById('round-display').innerText === '載入中...') {
                document.getElementById('round-display').innerText = t('loading');
            }
        }

        const socket = io();
        let myData = null, currentMarket = null, currentRound = 0;
        window.lastGameOverData = null; 

        function getUserId() {
            let uid = localStorage.getItem('stockGameUID');
            if (!uid) { uid = 'user_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36); localStorage.setItem('stockGameUID', uid); }
            return uid;
        }

        window.onload = function() {
            updateStaticUI();
            const savedName = localStorage.getItem('stockGameUser');
            if (savedName) { document.getElementById('username').value = savedName; attemptJoin(true); }
        };

        function attemptJoin(isAuto = false) {
            const nameInput = document.getElementById('username');
            const name = nameInput.value.trim();
            const uid = getUserId();
            if(name) {
                if(!isAuto) localStorage.setItem('stockGameUser', name);
                socket.emit('join_game', 'player', { name: name, userId: uid });
            }
        }

        function logout() {
            if(confirm("Are you sure?")) {
                localStorage.removeItem('stockGameUser');
                window.location.reload();
            }
        }

        socket.on('login_failed', (msg) => {
            alert(msg);
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('game-screen').style.display = 'none';
            localStorage.removeItem('stockGameUser');
        });

        socket.on('init_player', data => {
            if(data.reload) {
                localStorage.removeItem('stockGameUser'); localStorage.removeItem('stockGameUID'); window.location.reload(); return;
            }
            currentRound = data.round;
            document.getElementById('player-name-display').innerText = data.player.name;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateAll(data);
            if(data.lastEvent) showNews(data.lastEvent);
        });

        socket.on('update_player', data => { updateAll({ player: data.player, market: currentMarket }); if(data.msg) showToast(data.msg); });
        socket.on('error_msg', msg => showToast(msg));

        socket.on('new_round', data => {
            currentMarket = data.market;
            currentRound = data.round;
            document.getElementById('round-display').innerText = `Round ${data.round} (${data.round*3}m)`;
            renderMarket();
            if(myData) renderDeposits(myData.deposits);
            if(data.event) showNews(data.event);
        });

        socket.on('game_over', data => {
            window.lastGameOverData = data;
            renderGameOverScreen(data);
        });

        function renderGameOverScreen(data) {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('news-modal').style.display = 'none';
            
            const myUserId = getUserId();
            let uniquePlayersMap = {};
            for (let key in data.players) {
                let p = data.players[key];
                if (p && p.userId) uniquePlayersMap[p.userId] = p;
            }
            
            let allPlayers = Object.values(uniquePlayersMap).map(p => {
                let pStockVal = 0;
                for(let code in p.portfolio) { if(data.market[code]) pStockVal += p.portfolio[code] * data.market[code].price; }
                let pDepTotal = 0; if(p.deposits) p.deposits.forEach(d => pDepTotal += d.amount);
                return { userId: p.userId, name: p.name, total: p.cash + pDepTotal + pStockVal, cash: p.cash, depTotal: pDepTotal, stockVal: pStockVal };
            });
            allPlayers.sort((a, b) => b.total - a.total);
            let myRankIndex = allPlayers.findIndex(p => p.userId === myUserId);
            let myRank = myRankIndex + 1;
            let totalPlayers = allPlayers.length;
            
            document.getElementById('final-rank-badge').innerText = `${t('rank')} #${myRank} / ${totalPlayers}`;
            
            let me = allPlayers[myRankIndex];
            if(!me) {
                let fallbackMe = data.players[socket.id] || myData;
                let sVal = 0; for(let c in fallbackMe.portfolio) if(data.market[c]) sVal += fallbackMe.portfolio[c] * data.market[c].price;
                let dTotal = 0; if(fallbackMe.deposits) fallbackMe.deposits.forEach(d => dTotal += d.amount);
                me = { cash: fallbackMe.cash, depTotal: dTotal, stockVal: sVal, total: fallbackMe.cash + dTotal + sVal };
            }

            document.getElementById('final-assets').innerText = '$' + Math.floor(me.total).toLocaleString();
            document.getElementById('final-breakdown').innerHTML =
                `<div style="display:flex; justify-content:space-between; margin-bottom:12px; color:var(--text); border-bottom: 1px solid var(--border-light); padding-bottom: 8px;"><span style="color:var(--text-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 1px;">${t('cash')}</span> <span style="font-weight:600; font-family: var(--font-serif); font-size: 14px;">$${Math.floor(me.cash).toLocaleString()}</span></div>` +
                `<div style="display:flex; justify-content:space-between; margin-bottom:12px; color:var(--text); border-bottom: 1px solid var(--border-light); padding-bottom: 8px;"><span style="color:var(--text-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 1px;">${t('timeDeposit')}</span> <span style="font-weight:600; font-family: var(--font-serif); font-size: 14px;">$${Math.floor(me.depTotal).toLocaleString()}</span></div>` +
                `<div style="display:flex; justify-content:space-between; color:var(--text);"><span style="color:var(--text-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 1px;">${t('sec')}</span> <span style="font-weight:600; font-family: var(--font-serif); font-size: 14px;">$${Math.floor(me.stockVal).toLocaleString()}</span></div>`;
                
            let lbHtml = '';
            let topPlayers = allPlayers.slice(0, 5);
            topPlayers.forEach((p, i) => {
                let isMe = (p.userId === myUserId);
                let textColor = isMe ? 'var(--text)' : 'var(--text-dim)';
                let fontWeight = isMe ? '700' : '500';
                let indicator = isMe ? `<span style="font-size: 9px; margin-left: 8px; background: var(--text); color: var(--surface); padding: 2px 6px; font-family: var(--font-sans);">${t('you')}</span>` : '';
                lbHtml += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; color: ${textColor}; padding-bottom: 8px; border-bottom: 1px dotted var(--border-light);">
                    <div style="font-family: var(--font-serif); font-size: 14px; font-weight: ${fontWeight};"><span style="font-size: 11px; margin-right: 12px; font-family: var(--font-sans); color: var(--text-dim);">0${i+1}</span> ${p.name} ${indicator}</div>
                    <div style="font-family: var(--font-serif); font-size: 14px; font-weight: ${fontWeight};">$${Math.floor(p.total).toLocaleString()}</div>
                </div>`;
            });
            document.getElementById('final-leaderboard').innerHTML = lbHtml;
            document.getElementById('end-screen').style.display = 'flex';
        }

        function showNews(event) {
            document.getElementById('modal-title').innerText = event.title;
            document.getElementById('modal-desc').innerText = event.desc;
            document.getElementById('news-modal').style.display = 'flex';
        }
        
        function showInfo(type) {
            let keyPrefix = 'info' + type.charAt(0).toUpperCase() + type.slice(1);
            document.getElementById('info-title').innerText = t(keyPrefix + 'Title');
            document.getElementById('info-dse').innerText = t(keyPrefix + 'DSE');
            document.getElementById('info-fact').innerText = t(keyPrefix + 'Fact');
            document.getElementById('info-modal').style.display = 'flex';
        }

        function updateAll(data) {
            myData = data.player;
            if(data.market) currentMarket = data.market;
            if(data.round !== undefined) currentRound = data.round;
            document.getElementById('round-display').innerText = `Round ${currentRound} (${currentRound*3}m)`;
            let stockVal = 0;
            if(currentMarket) { for(let code in myData.portfolio) stockVal += myData.portfolio[code] * currentMarket[code].price; }
            let depositTotal = 0;
            if(myData.deposits) myData.deposits.forEach(d => depositTotal += d.amount);
            let total = myData.cash + depositTotal + stockVal;
            document.getElementById('p-cash').innerText = '$' + Math.floor(myData.cash).toLocaleString();
            document.getElementById('p-total').innerText = '$' + Math.floor(total).toLocaleString();
            renderDeposits(myData.deposits);
            renderMarket();
        }

        function renderDeposits(deposits) {
            const list = document.getElementById('deposit-list');
            if(!deposits || deposits.length === 0) {
                list.innerHTML = `<div style="text-align:left; color:var(--text-dim); font-size:11px; padding:12px; border: 1px solid var(--border-light); text-transform: uppercase; letter-spacing: 1px;">${t('noDep')}</div>`;
                return;
            }
            list.innerHTML = deposits.map(d => {
                let roundsLeft = d.maturityRound - currentRound;
                let statusColor = roundsLeft <= 0 ? 'var(--text)' : 'var(--text-dim)';
                let statusBg = roundsLeft <= 0 ? 'var(--border-light)' : 'transparent';
                let statusBorder = roundsLeft <= 0 ? 'var(--border)' : 'var(--border-light)';
                return `<div class="deposit-item">
                    <div>
                        <div style="font-weight:500; font-family: var(--font-serif); font-size: 18px; color:var(--text);">$${d.amount.toLocaleString()}</div>
                        <div style="font-size:10px; color:var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;">${d.duration} ${t('months')}</div>
                    </div>
                    <div style="font-size:8px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:${statusColor}; background:${statusBg}; padding:6px 10px; border:1px solid ${statusBorder};">
                        ${roundsLeft <= 0 ? t('proc') : `${roundsLeft} ${t('roundsLeft')}`}
                    </div>
                </div>`;
            }).join('');
        }

        function renderMarket() {
            if (!currentMarket) return;
            const list = document.getElementById('market-list');
            list.innerHTML = Object.keys(currentMarket).map(code => {
                const item = currentMarket[code];
                const holdingQty = myData.portfolio[code] || 0;
                const lotsHeld = Math.floor(holdingQty / item.lotSize);
                let costPerLot = item.price * item.lotSize;
                let feeMultiplier = item.type === 'stock' ? 1.004 : 1;
                let maxBuy = Math.floor(myData.cash / (costPerLot * feeMultiplier));
                if(item.type === 'bond' && (costPerLot < item.minEntry)) { let minLots = Math.ceil(item.minEntry / costPerLot); if (maxBuy < minLots) maxBuy = 0; }
                
                let unitName = item.type === 'gold' ? (currentLang === 'en' ? 'Tael' : '兩') : (currentLang === 'en' ? 'Lot' : '手');
                let shareUnit = item.type === 'gold' ? (currentLang === 'en' ? 'Tael' : '兩') : (item.type === 'bond' ? (currentLang === 'en' ? 'Unit' : '單位') : (currentLang === 'en' ? 'Share' : '股'));
                
                let buyOptions = maxBuy === 0 ? `<option value="0">${t('noCash')}</option>` : "";
                if (maxBuy > 0) { let limit = Math.min(maxBuy, 100); for(let i=1; i<=limit; i++) buyOptions += `<option value="${i}">${i} ${unitName} ($${Math.floor(i*costPerLot).toLocaleString()})</option>`; }
                let sellOptions = lotsHeld === 0 ? `<option value="0">${t('noHold')}</option>` : "";
                if (lotsHeld > 0) { let limit = Math.min(lotsHeld, 100); for(let i=1; i<=limit; i++) sellOptions += `<option value="${i}">${i} ${unitName}</option>`; }
                
                let change = item.change || 0; let pct = item.changePercent || 0;
                let colorClass = change >= 0 ? "text-up" : "text-down";
                let arrow = change > 0 ? "↗" : (change < 0 ? "↘" : "");
                let changeDisplay = change !== 0 ? `<span class="price-change ${colorClass}">${arrow} ${Math.abs(change).toFixed(2)} (${change>=0?"+":""}${pct.toFixed(1)}%)</span>` : `<span class="price-change" style="color:var(--text-dim);">—</span>`;
                
                let tagName = item.type === 'gold' ? 'GOLD' : (item.type === 'bond' ? 'BOND' : 'STOCK');
                let extraInfo = item.type === 'bond' ? `<br><span class="bond-info">${t('coupon')} ${item.coupon}%</span>` : '';
                
                return `<div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <div style="font-weight:500; font-family: var(--font-serif); font-size:20px; letter-spacing: -0.5px;">${item.name}<span class="tag" onclick="showInfo('${item.type}')" title="Click to learn more">${tagName}</span></div>
                            <div style="color:var(--text-dim); font-size:10px; margin-top:6px; font-weight: 500; letter-spacing: 0.5px;">${code}${extraInfo}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="market-price-disp">$${item.price.toFixed(2)}</div>
                            ${changeDisplay}
                        </div>
                    </div>
                    
                    <div class="holding-bar">
                        <span>${t('holding')}</span>
                        <span><strong>${holdingQty}</strong> ${shareUnit} / ${lotsHeld} ${unitName}</span>
                    </div>
                    
                    <div class="trade-grid">
                        <div class="trade-col">
                            <select id="buy-select-${code}">${buyOptions}</select>
                            <button class="${maxBuy > 0 ? 'btn-buy' : 'btn-disabled'}" style="width:100%; margin-top:4px;" onclick="trade('buy', '${code}')">${t('buy')}</button>
                        </div>
                        <div class="trade-col">
                            <select id="sell-select-${code}">${sellOptions}</select>
                            <button class="${lotsHeld > 0 ? 'btn-sell' : 'btn-disabled'}" style="width:100%; margin-top:4px;" onclick="trade('sell', '${code}')">${t('sell')}</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function trade(action, code) {
            const selectId = action === 'buy' ? `buy-select-${code}` : `sell-select-${code}`;
            const val = document.getElementById(selectId).value;
            if(val === "0" || !val) return;
            socket.emit('trade', action, code, parseInt(val));
        }
        function createDeposit() {
            const amt = document.getElementById('deposit-amount').value;
            const dur = document.getElementById('deposit-duration').value;
            if(!amt || amt <= 0) return showToast("Invalid amount");
            socket.emit('create_deposit', amt, dur);
            document.getElementById('deposit-amount').value = '';
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
